<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweetchew — Plan B Benchmark Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--card:#111;--card2:#0d0d0d;--border:#222;--border2:#333;
  --t1:#f5f5f5;--t2:#ccc;--t3:#888;--t4:#555;--t5:#333;
  --green:#1D9E75;--green2:#4ADE80;--green3:#6EE7B7;--green-bg:rgba(29,158,117,0.08);
  --amber:#D97706;--amber2:#FBBF24;--amber-bg:rgba(217,119,6,0.1);
  --red:#E24B4A;--red2:#F87171;--red-bg:rgba(234,75,74,0.1);
  --blue:#60A5FA;--purple:#C084FC;
  --mono:'JetBrains Mono',monospace;--thai:'Noto Sans Thai','JetBrains Mono',sans-serif;
}
body{font-family:var(--mono);background:var(--bg);color:var(--t2);line-height:1.5;padding:20px}
.wrap{max-width:940px;margin:0 auto}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px;margin-bottom:20px}

/* metric cards */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.metric{background:var(--card);border-radius:10px;padding:14px 16px;border:1px solid var(--border);position:relative;overflow:hidden}
.metric.accent{background:linear-gradient(135deg,#0a2e1f,#0f3d2a);border-color:var(--green)}
.metric-label{font-size:11px;color:var(--t3);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;font-family:var(--thai)}
.metric-value{font-size:22px;font-weight:600;color:var(--t1)}
.metric.accent .metric-value{color:var(--green2)}
.metric-sub{font-size:11px;color:var(--t4);margin-top:2px}

/* progress */
.progress-bar{height:10px;background:#1a1a1a;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:5px;transition:width 0.6s ease;background:linear-gradient(90deg,var(--green),#34D399)}
.progress-fill.done{background:linear-gradient(90deg,var(--green),var(--green2))}

/* month tabs */
.month-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.month-tab{padding:6px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-family:var(--thai);background:var(--card);color:var(--t4);position:relative;transition:all 0.15s}
.month-tab:hover{background:#1a1a1a;color:var(--t3)}
.month-tab.active{background:var(--green);color:#fff;font-weight:600;outline:2px solid #34D399;outline-offset:2px}
.month-tab.active.extra{background:#92400E;outline-color:var(--amber)}
.month-tab .dot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%}

/* table */
.bench-table{width:100%;border-collapse:collapse;font-size:13px}
.bench-table thead td{padding:6px 10px;font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:0.03em}
.bench-table tbody tr{background:var(--card2);transition:background 0.1s}
.bench-table tbody td{padding:10px}
.bench-table tbody td:first-child{border-radius:6px 0 0 6px}
.bench-table tbody td:last-child{border-radius:0 6px 6px 0}

/* inputs */
.actual-input{width:90px;text-align:right;background:#1a1a1a;border:1px solid var(--border2);border-radius:4px;padding:5px 8px;color:var(--t1);font-size:13px;font-family:var(--mono);outline:none;transition:border-color 0.2s}
.actual-input:focus{border-color:var(--green)}
.actual-input::placeholder{color:var(--t5)}

/* status badges */
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-family:var(--thai);display:inline-block}
.badge-pass{background:rgba(29,158,117,0.12);color:var(--green2)}
.badge-fail{background:var(--red-bg);color:var(--red2)}
.badge-extra{background:var(--amber-bg);color:var(--amber2)}
.badge-done{background:rgba(29,158,117,0.12);color:var(--green2)}
.badge-warn{background:rgba(234,179,8,0.1);color:#EAB308}

/* full year table */
.year-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.year-table th{padding:8px 6px;text-align:right;color:var(--t4);font-weight:400;border-bottom:1px solid var(--border)}
.year-table th:first-child{text-align:left}
.year-table td{padding:8px 6px;text-align:right;border-bottom:1px solid #141414}
.year-table td:first-child{text-align:left;font-family:var(--thai)}
.year-table tr.selected{background:var(--green-bg)}
.year-table tr:hover{background:rgba(255,255,255,0.015);cursor:pointer}

/* decision box */
.decision{padding:12px 16px;border-radius:8px;background:rgba(217,119,6,0.06);border:1px solid rgba(217,119,6,0.15);margin-top:16px}

/* rules grid */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule-card{padding:12px;background:var(--card2);border-radius:8px}

/* notes */
.notes-area{width:100%;min-height:60px;background:#0d0d0d;border:1px solid var(--border2);border-radius:8px;padding:10px;color:var(--t2);font-size:12px;font-family:var(--thai);resize:vertical;outline:none}
.notes-area:focus{border-color:var(--green)}

/* buttons */
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-family:var(--thai);transition:all 0.15s}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15805e}
.btn-red{background:#7f1d1d;color:#fca5a5}.btn-red:hover{background:#991b1b}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--t3)}.btn-outline:hover{background:#1a1a1a}

/* responsive */
@media(max-width:700px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .rules{grid-template-columns:1fr}
  .bench-table{font-size:12px}
  .actual-input{width:70px;font-size:12px}
}
@media(max-width:480px){
  .metrics{grid-template-columns:1fr}
  body{padding:12px}
}

/* save indicator */
.save-toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-family:var(--thai);opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:100}
.save-toast.show{opacity:1}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="save-toast" id="toast">บันทึกแล้ว ✓</div>

<script>
const D = {
  months:["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],
  monthsEn:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
  salesTarget:[5266,5114,7413,7413,4330,5138,7413,3860,5024,7413,7413,4229],
  halfSales:[2633,2557,3707,3707,2165,2569,3707,1930,2512,3707,3707,2115],
  cashProj:[4421,5725,7655,8988,5648,5484,4990,2534,3646,4060,3345,4792],
  cashMin:[3758,4866,5500,6500,4000,4000,3500,2200,3000,3500,2800,4000],
  arMax:[7899,7671,11120,11120,6495,7707,11120,5791,7536,11120,11120,6344],
  apMin:[3697,3590,4500,4500,3000,3600,4500,2700,3500,4500,4500,2900],
  dirBal:[4951,4715,3751,2315,2079,1844,1608,1372,336,0,0,0],
  dirExtra:[0,0,1200,1200,0,0,0,0,800,100,0,0],
  dirTotal:[236,236,1436,1436,236,236,236,236,1036,336,0,0],
  phase:["ปกติ","ปกติ","โปะ 1.2M","โปะ 1.2M","ปกติ","ปกติ","ปกติ","⚡ ระวัง cash","โปะ 800K","โปะ 100K","หมดแล้ว!","หมดแล้ว!"]
};

const STORAGE_KEY = "swc_planb_benchmark_v2";

let state = {
  selectedMonth: new Date().getMonth(),
  actuals: {},
  notes: {}
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.actuals = saved.actuals || {};
      state.notes = saved.notes || {};
      if (typeof saved.selectedMonth === "number") state.selectedMonth = saved.selectedMonth;
    }
  } catch(e) {}
  // Pre-fill Jan/Feb actuals if empty
  if (!state.actuals[0]) state.actuals[0] = {sales:"5266",cash:"4421",ar:"11700",ap:"3553"};
  if (!state.actuals[1]) state.actuals[1] = {sales:"5114",cash:"5725",ar:"8827",ap:"2258"};
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      actuals: state.actuals,
      notes: state.notes,
      selectedMonth: state.selectedMonth,
      lastSaved: new Date().toISOString()
    }));
    showToast();
  } catch(e) {}
}

function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

function fmt(n) {
  if (n === 0) return "0";
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(1)+"M";
  return n.toLocaleString()+"K";
}
function fmtFull(n) { return (n*1000).toLocaleString("th-TH",{maximumFractionDigits:0}); }
function getActual(m,k) { return state.actuals[m]?.[k] || ""; }
function setActual(m,k,v) {
  if (!state.actuals[m]) state.actuals[m] = {};
  state.actuals[m][k] = v;
  save();
  render();
}
function setNote(m,v) { state.notes[m] = v; save(); }

function checkMetric(m,key) {
  const val = parseFloat(getActual(m,key));
  if (isNaN(val)) return null;
  if (key === "sales") return val >= D.halfSales[m];
  if (key === "cash") return val >= D.cashMin[m];
  if (key === "ar") return val <= D.arMax[m];
  if (key === "ap") return val >= D.apMin[m];
  return null;
}

function monthStatus(m) {
  const keys = ["sales","cash","ar","ap"];
  const results = keys.map(k => checkMetric(m,k));
  if (results.every(r => r === null)) return null;
  const passed = results.filter(r => r === true).length;
  const checked = results.filter(r => r !== null).length;
  return { passed, checked, allOk: passed === checked && checked === 4, results };
}

function selectMonth(m) {
  state.selectedMonth = m;
  save();
  render();
}

function exportData() {
  const data = { benchmark:"Sweetchew Plan B", exported: new Date().toISOString(), actuals: state.actuals, notes: state.notes };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "planb_benchmark_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.actuals) state.actuals = {...state.actuals, ...data.actuals};
      if (data.notes) state.notes = {...state.notes, ...data.notes};
      save();
      render();
      alert("นำเข้าข้อมูลสำเร็จ!");
    } catch(err) { alert("ไฟล์ไม่ถูกต้อง"); }
  };
  reader.readAsText(file);
}

function clearData() {
  if (confirm("ล้างข้อมูลทั้งหมด? (ยกเว้น ม.ค.-ก.พ. ที่เป็น actual)")) {
    state.actuals = {
      0:{sales:"5266",cash:"4421",ar:"11700",ap:"3553"},
      1:{sales:"5114",cash:"5725",ar:"8827",ap:"2258"}
    };
    state.notes = {};
    save();
    render();
  }
}

function render() {
  const m = state.selectedMonth;
  const pctPaid = ((5187 - (D.dirBal[m]||0)) / 5187 * 100);
  const ms = monthStatus(m);

  let html = `
  <!-- Header -->
  <div style="margin-bottom:24px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:11px;color:var(--green);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:4px">Sweetchew Financial Control</div>
        <h1 style="font-size:22px;font-weight:600;color:var(--t1);font-family:var(--thai)">Plan B Benchmark — โปะหนี้กรรมการ</h1>
        <div style="font-size:12px;color:var(--t4);margin-top:4px">เป้าหมาย: ปิดหนี้ 5.19M ภายใน ต.ค. 2569 | Half-month checkpoint</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-outline" onclick="exportData()">↓ Export</button>
        <label class="btn btn-outline" style="cursor:pointer">↑ Import<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label>
        <button class="btn btn-red" onclick="clearData()">ล้างข้อมูล</button>
      </div>
    </div>
  </div>

  <!-- Metric Cards -->
  <div class="metrics">
    <div class="metric ${D.dirBal[m]===0?'accent':''}">
      <div class="metric-label">ยอดหนี้เหลือ</div>
      <div class="metric-value">${fmt(D.dirBal[m])}</div>
      <div class="metric-sub">${D.dirBal[m]===0?"ปิดหนี้แล้ว!":"เป้า "+D.months[m]+": "+fmt(D.dirBal[m])}</div>
    </div>
    <div class="metric">
      <div class="metric-label">ชำระแล้ว</div>
      <div class="metric-value">${pctPaid.toFixed(0)}%</div>
      <div class="metric-sub">${fmt(5187-(D.dirBal[m]||0))} จาก 5.19M</div>
    </div>
    <div class="metric">
      <div class="metric-label">โปะเพิ่มเดือนนี้</div>
      <div class="metric-value">${D.dirExtra[m]>0?fmt(D.dirExtra[m]):"—"}</div>
      <div class="metric-sub">${D.dirExtra[m]>0?"ถ้า benchmark ผ่าน":"จ่ายปกติ 236K"}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Cash เป้าหมาย</div>
      <div class="metric-value">${fmt(D.cashProj[m])}</div>
      <div class="metric-sub">ขั้นต่ำ ${fmt(D.cashMin[m])}</div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="card" style="padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:12px;color:var(--t3);font-family:var(--thai)">ความคืบหน้าชำระหนี้กรรมการ</span>
      <span style="font-size:12px;color:var(--green2);font-weight:500">${fmt(5187-(D.dirBal[m]||0))} / 5.19M</span>
    </div>
    <div class="progress-bar"><div class="progress-fill ${pctPaid>=100?'done':''}" style="width:${Math.min(pctPaid,100)}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px">
      ${D.months.map((mo,i) => `
        <div style="font-size:9px;text-align:center;color:${i===m?'var(--green2)':i<=m?'var(--t4)':'var(--t5)'};font-weight:${i===m?600:400};cursor:pointer;padding:2px 0;border-bottom:${D.dirExtra[i]>0?'2px solid var(--amber)':'none'}" onclick="selectMonth(${i})">
          ${mo.replace(".","")}${D.dirExtra[i]>0?'<br><span style="color:var(--amber);font-size:8px">โปะ</span>':''}
        </div>
      `).join("")}
    </div>
  </div>

  <!-- Month Tabs -->
  <div class="month-tabs">
    ${D.months.map((mo,i) => {
      const st = monthStatus(i);
      const isExtra = D.dirExtra[i] > 0;
      const active = i === m;
      return `<button class="month-tab ${active?'active':''} ${active&&isExtra?'extra':''}" onclick="selectMonth(${i})">
        ${mo}
        ${st ? `<span class="dot" style="background:${st.allOk?'var(--green)':'var(--red)'}"></span>` : ''}
      </button>`;
    }).join("")}
  </div>

  <!-- Selected Month Detail -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div>
        <span style="font-size:18px;font-weight:600;color:var(--t1);font-family:var(--thai)">${D.months[m]} 2569</span>
        <span class="badge ${D.dirExtra[m]>0?'badge-extra':D.dirBal[m]===0?'badge-done':'badge-warn'}" style="margin-left:10px;font-size:11px;padding:3px 10px">${D.phase[m]}</span>
      </div>
      <div style="font-size:12px;color:var(--t4)">
        จ่ายรวม: <span style="color:var(--t1);font-weight:500">${fmtFull(D.dirTotal[m])} ฿</span>
      </div>
    </div>

    <table class="bench-table">
      <thead><tr>
        <td style="width:22%">Metric</td>
        <td style="width:16%;text-align:right">½ เดือน</td>
        <td style="width:16%;text-align:right">Full-month</td>
        <td style="width:24%;text-align:right">Actual (พัน฿)</td>
        <td style="width:22%;text-align:center">Status</td>
      </tr></thead>
      <tbody>`;

  const rows = [
    {key:"sales",label:"Sales ยอดขาย",half:D.halfSales[m],full:D.salesTarget[m],rule:"≥",color:"var(--blue)"},
    {key:"cash",label:"Cash เงินสด",half:Math.round(D.cashMin[m]*0.75),full:D.cashMin[m],rule:"≥",color:"var(--green2)"},
    {key:"ar",label:"AR ลูกหนี้",half:D.arMax[m],full:D.arMax[m],rule:"≤",color:"var(--amber2)"},
    {key:"ap",label:"AP เจ้าหนี้",half:Math.round(D.apMin[m]*0.8),full:D.apMin[m],rule:"≥",color:"var(--purple)"}
  ];

  rows.forEach(r => {
    const ok = checkMetric(m,r.key);
    const val = getActual(m,r.key);
    html += `<tr>
      <td style="border-left:3px solid ${r.color}"><span style="font-family:var(--thai);font-size:12px;color:var(--t2)">${r.label}</span></td>
      <td style="text-align:right;color:var(--t3);font-size:12px">${r.rule} ${fmt(r.half)}</td>
      <td style="text-align:right;font-weight:500;color:var(--t1)">${r.rule} ${fmt(r.full)}</td>
      <td style="text-align:right"><input class="actual-input" value="${val}" placeholder="—" onchange="setActual(${m},'${r.key}',this.value)" oninput="setActual(${m},'${r.key}',this.value)"></td>
      <td style="text-align:center">${ok===null?'<span style="color:var(--t5)">—</span>':ok?'<span class="badge badge-pass">✓ ผ่าน</span>':'<span class="badge badge-fail">✗ ไม่ผ่าน</span>'}</td>
    </tr>`;
  });

  html += `</tbody></table>`;

  // Decision box for extra payment months
  if (D.dirExtra[m] > 0) {
    const st = ms;
    let decision = "";
    if (st && st.checked >= 3) {
      if (st.passed >= 4) decision = `<div style="margin-top:8px;padding:8px 12px;background:rgba(29,158,117,0.1);border-radius:6px;color:var(--green2);font-size:12px;font-family:var(--thai)">✅ ผ่าน ${st.passed}/4 → <strong>โปะเต็มจำนวน ${fmtFull(D.dirExtra[m])} ฿</strong></div>`;
      else if (st.passed >= 3) decision = `<div style="margin-top:8px;padding:8px 12px;background:var(--amber-bg);border-radius:6px;color:var(--amber2);font-size:12px;font-family:var(--thai)">⚠️ ผ่าน ${st.passed}/4 → <strong>โปะ 50% = ${fmtFull(D.dirExtra[m]/2)} ฿</strong></div>`;
      else decision = `<div style="margin-top:8px;padding:8px 12px;background:var(--red-bg);border-radius:6px;color:var(--red2);font-size:12px;font-family:var(--thai)">⛔ ผ่าน ${st.passed}/4 → <strong>จ่ายเฉพาะปกติ 235,750 ฿</strong></div>`;
    }
    html += `<div class="decision">
      <div style="font-size:12px;color:var(--amber2);font-weight:500;margin-bottom:4px;font-family:var(--thai)">การตัดสินใจโปะเพิ่ม ${fmtFull(D.dirExtra[m])} ฿</div>
      <div style="font-size:11px;color:#A88544;line-height:1.7;font-family:var(--thai)">
        4/4 ผ่าน → โปะเต็มจำนวน &nbsp;|&nbsp; 3/4 ผ่าน → โปะ 50% &nbsp;|&nbsp; ≤ 2/4 → จ่ายปกติเท่านั้น
      </div>
      ${decision}
    </div>`;
  }

  // Notes
  html += `
    <div style="margin-top:16px">
      <div style="font-size:11px;color:var(--t3);margin-bottom:6px;font-family:var(--thai)">บันทึกประจำเดือน ${D.months[m]}</div>
      <textarea class="notes-area" placeholder="จดบันทึก เช่น สาเหตุ AR สูง, ลูกค้าจ่ายช้า, สต๊อกเพิ่ม..." onchange="setNote(${m},this.value)" oninput="setNote(${m},this.value)">${state.notes[m]||""}</textarea>
    </div>
  </div>

  <!-- Chart -->
  <div class="card">
    <div style="font-size:13px;font-weight:500;color:var(--t2);margin-bottom:14px;font-family:var(--thai)">ภาพรวมทั้งปี — Cash vs หนี้กรรมการ</div>
    <div style="display:flex;gap:16px;margin-bottom:12px;font-size:11px;flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:3px;background:var(--green2);border-radius:2px;display:inline-block"></span><span style="color:var(--t3)">Cash คาดการณ์</span></span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:3px;background:var(--blue);border-radius:2px;display:inline-block"></span><span style="color:var(--t3)">Cash จริง</span></span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:3px;background:var(--red);border-radius:2px;display:inline-block;opacity:0.5"></span><span style="color:var(--t3)">Cash ขั้นต่ำ</span></span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:rgba(217,119,6,0.4);border-radius:2px;display:inline-block"></span><span style="color:var(--t3)">หนี้กรรมการ</span></span>
    </div>
    <div id="chart-container" style="position:relative;width:100%;height:280px"></div>
  </div>

  <!-- Full Year Table -->
  <div class="card" style="overflow-x:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:13px;font-weight:500;color:var(--t2);font-family:var(--thai)">Benchmark ทั้ง 12 เดือน (พันบาท)</div>
      <div style="font-size:10px;color:var(--t4)">คลิกเลือกเดือน</div>
    </div>
    <table class="year-table">
      <tr>
        <th style="text-align:left">เดือน</th>
        <th style="color:var(--blue)">Sales เป้า</th>
        <th style="color:var(--blue)">½ เดือน</th>
        <th style="color:var(--green2)">Cash min</th>
        <th style="color:var(--amber2)">AR max</th>
        <th style="color:var(--purple)">AP min</th>
        <th style="color:var(--red2)">โปะเพิ่ม</th>
        <th style="color:var(--red2)">หนี้เหลือ</th>
        <th style="text-align:center">สถานะ</th>
      </tr>`;

  D.months.forEach((mo,i) => {
    const sel = i===m;
    const isExtra = D.dirExtra[i]>0;
    const done = D.dirBal[i]===0;
    const st = monthStatus(i);
    html += `<tr class="${sel?'selected':''}" onclick="selectMonth(${i})">
      <td style="font-weight:${sel?600:400};color:${sel?'var(--green2)':'var(--t2)'}">${sel?'▸ ':''}${mo}</td>
      <td style="color:var(--t1)">${D.salesTarget[i].toLocaleString()}</td>
      <td style="color:var(--t3)">${D.halfSales[i].toLocaleString()}</td>
      <td style="color:${i===7?'var(--amber2)':'var(--t1)'}">${D.cashMin[i].toLocaleString()}</td>
      <td>${D.arMax[i].toLocaleString()}</td>
      <td>${D.apMin[i].toLocaleString()}</td>
      <td style="color:${isExtra?'var(--amber2)':'var(--t5)'};font-weight:${isExtra?600:400}">${isExtra?D.dirExtra[i].toLocaleString():'—'}</td>
      <td style="color:${done?'var(--green2)':'var(--t1)'};font-weight:${done?600:400}">${done?'0 ✓':D.dirBal[i].toLocaleString()}</td>
      <td style="text-align:center"><span class="badge ${done?'badge-done':isExtra?'badge-extra':i===7?'badge-warn':''}" style="font-size:10px">${D.phase[i]}</span>
        ${st?`<span class="badge ${st.allOk?'badge-pass':'badge-fail'}" style="margin-left:4px;font-size:9px">${st.passed}/${st.checked}</span>`:''}
      </td>
    </tr>`;
  });

  html += `</table></div>

  <!-- Decision Rules -->
  <div class="card">
    <div style="font-size:13px;font-weight:500;color:var(--t2);margin-bottom:12px;font-family:var(--thai)">กฎตัดสินใจ (Decision rules)</div>
    <div class="rules">
      <div class="rule-card" style="border-left:3px solid var(--blue)">
        <div style="font-size:12px;font-weight:500;color:var(--t1);margin-bottom:4px;font-family:var(--thai)">📊 Sales ≥ เป้าครึ่งเดือน</div>
        <div style="font-size:11px;color:var(--t3);line-height:1.5;font-family:var(--thai)">ยอดขายสะสม 15 วันแรก ≥ 50% ของเป้าเดือน</div>
      </div>
      <div class="rule-card" style="border-left:3px solid var(--green2)">
        <div style="font-size:12px;font-weight:500;color:var(--t1);margin-bottom:4px;font-family:var(--thai)">💰 Cash ≥ ขั้นต่ำ</div>
        <div style="font-size:11px;color:var(--t3);line-height:1.5;font-family:var(--thai)">เงินสดปลายเดือน ≥ Cash min หลังหักโปะ</div>
      </div>
      <div class="rule-card" style="border-left:3px solid var(--amber2)">
        <div style="font-size:12px;font-weight:500;color:var(--t1);margin-bottom:4px;font-family:var(--thai)">📑 AR ≤ เพดาน</div>
        <div style="font-size:11px;color:var(--t3);line-height:1.5;font-family:var(--thai)">ลูกหนี้ ≤ 1.5x ยอดขาย (DSO ≤ 45 วัน)</div>
      </div>
      <div class="rule-card" style="border-left:3px solid var(--purple)">
        <div style="font-size:12px;font-weight:500;color:var(--t1);margin-bottom:4px;font-family:var(--thai)">🤝 AP ≥ พื้น</div>
        <div style="font-size:11px;color:var(--t3);line-height:1.5;font-family:var(--thai)">เจ้าหนี้ ≥ เป้า (DPO ≥ 35 วัน) อย่าจ่ายเร็วเกิน</div>
      </div>
    </div>
    <div style="margin-top:14px;padding:10px 14px;background:var(--green-bg);border-radius:8px;border:1px solid rgba(29,158,117,0.15)">
      <div style="font-size:11px;color:var(--green3);line-height:1.7;font-family:var(--thai)">
        <strong>4/4 ผ่าน</strong> → โปะเต็มจำนวน &nbsp;|&nbsp;
        <strong>3/4 ผ่าน</strong> → โปะ 50% &nbsp;|&nbsp;
        <strong>≤ 2/4 ผ่าน</strong> → จ่ายปกติ 235,750 เท่านั้น &nbsp;|&nbsp;
        <strong style="color:#FCA5A5">ก.ค.-ส.ค.</strong> → ห้ามโปะเพิ่ม (cash dip season)
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="text-align:center;padding:20px 0;font-size:10px;color:var(--t5)">
    Sweetchew Plan B Benchmark v2.0 | ข้อมูลบันทึกอัตโนมัติใน browser นี้<br>
    ${localStorage.getItem(STORAGE_KEY) ? 'บันทึกล่าสุด: '+new Date(JSON.parse(localStorage.getItem(STORAGE_KEY)).lastSaved||'').toLocaleString('th-TH') : ''}
  </div>`;

  document.getElementById("app").innerHTML = html;
  drawChart();
}

function drawChart() {
  const container = document.getElementById("chart-container");
  if (!container) return;
  const W = container.offsetWidth;
  const H = 280;
  const pad = {l:50,r:20,t:20,b:30};
  const cw = W-pad.l-pad.r;
  const ch = H-pad.t-pad.b;
  const maxVal = 10000;
  const m = state.selectedMonth;

  function x(i) { return pad.l + (i/(D.months.length-1))*cw; }
  function y(v) { return pad.t + ch - (v/maxVal)*ch; }
  function barX(i) { return pad.l + (i/D.months.length)*cw + cw/D.months.length*0.15; }
  function barW() { return cw/D.months.length*0.45; }

  let svg = `<svg width="${W}" height="${H}" style="display:block">`;

  // Grid
  [0,2000,4000,6000,8000,10000].forEach(v => {
    svg += `<line x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}" stroke="#1a1a1a" stroke-width="1"/>`;
    svg += `<text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end" fill="#444" font-size="9" font-family="JetBrains Mono">${v/1000}M</text>`;
  });

  // Selected month highlight
  const hlX = barX(m) - 4;
  const hlW = barW() + 8;
  svg += `<rect x="${hlX}" y="${pad.t}" width="${hlW}" height="${ch}" rx="4" fill="rgba(29,158,117,0.06)" stroke="var(--green)" stroke-width="0.5" stroke-dasharray="3,3"/>`;

  // Director balance bars
  D.dirBal.forEach((b,i) => {
    const bh = (b/maxVal)*ch;
    svg += `<rect x="${barX(i)}" y="${y(b)}" width="${barW()}" height="${bh}" rx="3" fill="rgba(217,119,6,0.25)" ${D.dirExtra[i]>0?'stroke="#D97706" stroke-width="1"':''}/>`;
  });

  // Cash min dashed line
  let minPts = D.cashMin.map((c,i) => `${x(i)},${y(c)}`).join(" ");
  svg += `<polyline fill="none" stroke="var(--red)" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" points="${minPts}"/>`;

  // Cash projected line
  let cashPts = D.cashProj.map((c,i) => `${x(i)},${y(c)}`).join(" ");
  svg += `<polyline fill="none" stroke="var(--green2)" stroke-width="2" stroke-linejoin="round" points="${cashPts}"/>`;
  D.cashProj.forEach((c,i) => {
    svg += `<circle cx="${x(i)}" cy="${y(c)}" r="3" fill="var(--green2)"/>`;
    if (i===m || D.dirExtra[i]>0) {
      svg += `<text x="${x(i)}" y="${y(c)-10}" text-anchor="middle" fill="var(--green2)" font-size="9" font-weight="500" font-family="JetBrains Mono">${(c/1000).toFixed(1)}M</text>`;
    }
  });

  // Actual cash dots (blue)
  D.months.forEach((_,i) => {
    const val = parseFloat(getActual(i,"cash"));
    if (!isNaN(val) && val > 0) {
      svg += `<circle cx="${x(i)}" cy="${y(val)}" r="4" fill="var(--blue)" stroke="#0a0a0a" stroke-width="1.5"/>`;
      svg += `<text x="${x(i)}" y="${y(val)-10}" text-anchor="middle" fill="var(--blue)" font-size="9" font-weight="500" font-family="JetBrains Mono">${(val/1000).toFixed(1)}M</text>`;
    }
  });

  // Month labels
  D.months.forEach((mo,i) => {
    svg += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" fill="${i===m?'var(--green2)':'var(--t4)'}" font-size="10" font-weight="${i===m?600:400}" style="cursor:pointer" onclick="selectMonth(${i})">${mo.replace(".","")}.</text>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
}

window.addEventListener("resize", () => {
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(drawChart, 150);
});

load();
render();
</script>
</body>
</html>
